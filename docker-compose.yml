services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kfchess
      POSTGRES_USER: kfchess
      POSTGRES_PASSWORD: kfchess
    ports:
      # Host-side 55432, not 5432 - this machine already has a standalone
      # Postgres bound to the real 5432 (unrelated to this project); the
      # game-server container still talks to this one at the normal 5432
      # over the internal docker-compose network (see DATABASE_URL below).
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfchess -d kfchess"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2-alpine
    # -m 8222 turns on the HTTP monitoring endpoint the healthcheck below
    # polls - core NATS pub/sub only (no -js/JetStream): the two lifecycle
    # events this project publishes are fire-and-forget, nothing needs a
    # durable/replayable subscription.
    command: ["-m", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  matchmaker:
    build:
      context: .
      dockerfile: services/matchmaker/Dockerfile
    environment:
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  game-allocator:
    build:
      context: .
      dockerfile: services/game_allocator/Dockerfile
    environment:
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  persistence-worker:
    build:
      context: .
      dockerfile: services/persistence_worker/Dockerfile
    environment:
      DATABASE_URL: "postgresql://kfchess:kfchess@postgres:5432/kfchess"
      NATS_URL: "nats://nats:4222"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://kfchess:kfchess@postgres:5432/kfchess"
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  game-server:
    build: .
    ports:
      - "8765:8765"
    environment:
      KFCHESS_HOST: "0.0.0.0"
      KFCHESS_PORT: "8765"
      DATABASE_URL: "postgresql://kfchess:kfchess@postgres:5432/kfchess"
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
      # The standalone matchmaker/game-allocator services above are doing
      # the matchmaking tick/pairing/allocation now - see
      # GameLoop.start_matchmaking_relay's own docstring for why this must
      # stay in lockstep with whether matchmaker is actually running (both
      # polling the same Redis-backed queue at once would race).
      EXTERNAL_MATCHMAKER: "1"
      # This shard's own self-identification, heartbeated into
      # server/redis/shard_registry.py's ShardRegistry (see
      # server/main.py's _maybe_start_shard_heartbeat) - "game-server", the
      # real Compose service/DNS name, so it's a genuine, reachable address
      # rather than a made-up label. game-allocator discovers this
      # dynamically now instead of being told it directly (compare: it used
      # to hold its own now-removed SHARD_ADDRESS above).
      SHARD_ADDRESS: "game-server"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      matchmaker:
        condition: service_started
      game-allocator:
        condition: service_started

  # A second, independent shard - same image, same everything as
  # game-server above except its own SHARD_ADDRESS/port, so
  # ShardRegistry.pick_shard() (services/game_allocator/main.py) actually
  # has more than one live shard to choose between. Without this, PLAY/room
  # allocation always resolves to the one shard above regardless of
  # whether the lease/allocation logic itself is correct - this is what
  # lets that routing be exercised for real instead of only in theory.
  game-server-2:
    build: .
    ports:
      - "8766:8765"
    environment:
      KFCHESS_HOST: "0.0.0.0"
      KFCHESS_PORT: "8765"
      DATABASE_URL: "postgresql://kfchess:kfchess@postgres:5432/kfchess"
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
      EXTERNAL_MATCHMAKER: "1"
      SHARD_ADDRESS: "game-server-2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      matchmaker:
        condition: service_started
      game-allocator:
        condition: service_started

volumes:
  postgres-data:

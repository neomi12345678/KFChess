services:
  # Primary - the one writer. Server_Design.md §5's own "PostgreSQL/MySQL,
  # primary + read replicas" - wal_level/max_wal_senders/hot_standby are
  # what actually let postgres-replica (below) stream from this one;
  # docker/postgres/enable-replication.sh (mounted into
  # docker-entrypoint-initdb.d, runs once on first boot only) is what lets
  # that replica's connection authenticate at all.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kfchess
      POSTGRES_USER: kfchess
      POSTGRES_PASSWORD: kfchess
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "hot_standby=on"]
    ports:
      # Host-side 55432, not 5432 - this machine already has a standalone
      # Postgres bound to the real 5432 (unrelated to this project); the
      # game-server container still talks to this one at the normal 5432
      # over the internal docker-compose network (see DATABASE_URL below).
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/enable-replication.sh:/docker-entrypoint-initdb.d/enable-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfchess -d kfchess"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Read replica - a genuine streaming standby (see
  # docker/postgres/replica-entrypoint.sh's own pg_basebackup -R), not a
  # second independent database. services/api_gateway/main.py's own
  # DATABASE_URL_REPLICA points here, for the read-only, staleness-tolerant
  # rating lookups behind POST /login and POST /play (see that module's own
  # docstring on why *those* reads specifically, and not
  # server/postgres/accounts.py's own PostgresRatingStore.update_rating -
  # a standby physically rejects writes, so misrouting one here would fail
  # loudly, not silently diverge). depends_on postgres being healthy first,
  # not just started - pg_basebackup needs the primary actually accepting
  # connections, not merely mid-initdb.
  postgres-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kfchess
      POSTGRES_PASSWORD: kfchess
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres
      PRIMARY_PORT: "5432"
    entrypoint: ["/scripts/replica-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "55434:5432"
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfchess -d kfchess"]
      interval: 2s
      timeout: 3s
      # More retries than the primary's own healthcheck - pg_basebackup
      # cloning the primary's data directory on first boot takes real time
      # (however small this demo dataset is), unlike the primary's own
      # near-instant initdb.
      retries: 60

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2-alpine
    # -m 8222 turns on the HTTP monitoring endpoint the healthcheck below
    # polls - core NATS pub/sub only (no -js/JetStream): the two lifecycle
    # events this project publishes are fire-and-forget, nothing needs a
    # durable/replayable subscription.
    command: ["-m", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  matchmaker:
    build:
      context: .
      dockerfile: services/matchmaker/Dockerfile
    environment:
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    # Server_Design.md §9's own health/readiness probes - /healthz on this
    # service's own observability server (server/observability_server.py),
    # default port per services/matchmaker/main.py's own HEALTH_PORT.
    # python, not curl/wget - python:3.11-slim (every image in this
    # project's own build) doesn't ship either of those, but always has
    # python itself.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9102/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  game-allocator:
    build:
      context: .
      dockerfile: services/game_allocator/Dockerfile
    environment:
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9103/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  persistence-worker:
    build:
      context: .
      dockerfile: services/persistence_worker/Dockerfile
    environment:
      DATABASE_URL: "postgresql://kfchess:kfchess@postgres:5432/kfchess"
      NATS_URL: "nats://nats:4222"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9104/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://kfchess:kfchess@postgres:5432/kfchess"
      # Server_Design.md §5's own read-replica routing - the standalone
      # API Gateway's own rating_store reads through this instead (see
      # services/api_gateway/main.py's own build_app), leaving DATABASE_URL
      # above as the primary every write (and every other read) still uses.
      DATABASE_URL_REPLICA: "postgresql://kfchess:kfchess@postgres-replica:5432/kfchess"
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    # This one's /healthz lives on the same aiohttp app/port as everything
    # else (see services/api_gateway/main.py's own docstring on why it
    # gets ordinary routes instead of a second server) - no separate
    # observability port to reference.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The public entry point for the live game itself (moves/snapshots) -
  # see services/ws_gateway/main.py's own docstring. Needs no Postgres (no
  # auth/rating here) and no dependency on game-server/game-server-2 being
  # up yet - it only ever opens an internal connection to one lazily, once
  # a real client actually identifies.
  ws-gateway:
    build:
      context: .
      dockerfile: services/ws_gateway/Dockerfile
    ports:
      - "8767:8767"
    environment:
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9101/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  # No public "ports:" mapping - Server_Design.md §3's "Game Server Shards
  # carry no public IP at all" - only ws-gateway (below) ever opens a
  # connection to this, from inside the compose network. A bare-metal
  # `python -m server.main` (no compose at all) is unaffected - the
  # protocol/types.py-default port it binds was never this container's.
  game-server:
    build: .
    environment:
      KFCHESS_HOST: "0.0.0.0"
      KFCHESS_PORT: "8765"
      DATABASE_URL: "postgresql://kfchess:kfchess@postgres:5432/kfchess"
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
      # The standalone matchmaker/game-allocator services above are doing
      # the matchmaking tick/pairing/allocation now - see
      # GameLoop.start_matchmaking_relay's own docstring for why this must
      # stay in lockstep with whether matchmaker is actually running (both
      # polling the same Redis-backed queue at once would race).
      EXTERNAL_MATCHMAKER: "1"
      # This shard's own self-identification, heartbeated into
      # server/redis/shard_registry.py's ShardRegistry (see
      # server/main.py's _maybe_start_shard_heartbeat) - "game-server", the
      # real Compose service/DNS name, so it's a genuine, reachable address
      # rather than a made-up label. game-allocator discovers this
      # dynamically now instead of being told it directly (compare: it used
      # to hold its own now-removed SHARD_ADDRESS above).
      SHARD_ADDRESS: "game-server"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      matchmaker:
        condition: service_started
      game-allocator:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9105/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  # A second, independent shard - same image, same everything as
  # game-server above except its own SHARD_ADDRESS/port, so
  # ShardRegistry.pick_shard() (services/game_allocator/main.py) actually
  # has more than one live shard to choose between. Without this, PLAY/room
  # allocation always resolves to the one shard above regardless of
  # whether the lease/allocation logic itself is correct - this is what
  # lets that routing be exercised for real instead of only in theory.
  game-server-2:
    build: .
    environment:
      KFCHESS_HOST: "0.0.0.0"
      KFCHESS_PORT: "8765"
      DATABASE_URL: "postgresql://kfchess:kfchess@postgres:5432/kfchess"
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
      EXTERNAL_MATCHMAKER: "1"
      SHARD_ADDRESS: "game-server-2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      matchmaker:
        condition: service_started
      game-allocator:
        condition: service_started
    # Same internal port as game-server's own healthcheck - a separate
    # container, own network namespace, no collision.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9105/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  postgres-replica-data:

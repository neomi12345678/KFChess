# Dev/demo-parity translation of docker-compose.yml's own postgres +
# postgres-replica pair (same docker/postgres/*.sh scripts, baked in here
# as ConfigMaps instead of bind-mounted files) - Server_Design.md §5's own
# "PostgreSQL/MySQL, primary + read replicas." A REAL production rollout
# should use a managed Postgres (RDS/Cloud SQL) or an HA operator like
# Patroni (§9's own table names it explicitly) instead of this StatefulSet
# pair - neither this file nor hand-rolled streaming replication carries
# automatic failover (a dead primary here needs a human, or a real
# operator, to promote the replica), which is exactly the gap a managed
# service/Patroni closes.

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-primary-init
  namespace: kfchess
data:
  enable-replication.sh: |
    #!/bin/sh
    # Runs once, automatically, on the primary's first boot only (see
    # docker/postgres/enable-replication.sh, this manifest's own copy of
    # the same script docker-compose.yml bind-mounts instead). Appends a
    # pg_hba.conf rule letting the postgres-replica StatefulSet open a
    # streaming-replication connection as the same POSTGRES_USER already
    # used for ordinary connections.
    set -e
    echo "host replication ${POSTGRES_USER} all scram-sha-256" >> "$PGDATA/pg_hba.conf"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-replica-entrypoint
  namespace: kfchess
data:
  replica-entrypoint.sh: |
    #!/bin/sh
    # See docker/postgres/replica-entrypoint.sh, this manifest's own copy
    # of the same script docker-compose.yml bind-mounts instead: clones
    # the primary via pg_basebackup -R on first boot (empty PGDATA), then
    # starts postgres normally - standby.signal (written by -R) is what
    # keeps it in continuous streaming-recovery mode after that.
    set -e
    if [ -z "$(ls -A "$PGDATA" 2>/dev/null)" ]; then
        echo "PGDATA is empty - bootstrapping as a streaming replica of ${PRIMARY_HOST}:${PRIMARY_PORT:-5432}"
        PGPASSWORD="$POSTGRES_PASSWORD" pg_basebackup \
            -h "$PRIMARY_HOST" -p "${PRIMARY_PORT:-5432}" -U "$POSTGRES_USER" \
            -D "$PGDATA" -Fp -Xs -P -R
    fi
    exec docker-entrypoint.sh postgres

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kfchess
spec:
  clusterIP: None  # headless - StatefulSet pods get a stable DNS identity, not load-balanced
  selector:
    app: postgres
  ports:
    - port: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kfchess
spec:
  serviceName: postgres
  replicas: 1  # the one writer - see this file's own top comment on real HA
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # wal_level/max_wal_senders/hot_standby - what actually lets
          # postgres-replica (below) stream from this one, same command:
          # override docker-compose.yml's own postgres service uses.
          command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "hot_standby=on"]
          envFrom:
            - secretRef:
                name: kfchess-postgres-credentials
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kfchess", "-d", "kfchess"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kfchess", "-d", "kfchess"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-primary-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: kfchess
spec:
  clusterIP: None
  selector:
    app: postgres-replica
  ports:
    - port: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: kfchess
spec:
  serviceName: postgres-replica
  replicas: 1  # add more for read-scaling - each just needs its own PVC + this same entrypoint
  selector:
    matchLabels:
      app: postgres-replica
  template:
    metadata:
      labels:
        app: postgres-replica
    spec:
      containers:
        - name: postgres-replica
          image: postgres:16-alpine
          command: ["/scripts/replica-entrypoint.sh"]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data
            - name: PRIMARY_HOST
              value: postgres
            - name: PRIMARY_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: kfchess-postgres-credentials
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: entrypoint
              mountPath: /scripts
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kfchess", "-d", "kfchess"]
            initialDelaySeconds: 10
            periodSeconds: 5
            # pg_basebackup cloning the primary on first boot takes real
            # time, unlike the primary's own near-instant initdb - see
            # docker-compose.yml's own postgres-replica healthcheck for
            # the same reasoning.
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kfchess", "-d", "kfchess"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: entrypoint
          configMap:
            name: postgres-replica-entrypoint
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
